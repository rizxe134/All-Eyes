name: release-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          MAC_KIND=AppleSilicon-arm64 npx electron-builder --mac zip --arm64 --publish never
          MAC_KIND=Intel-x64 npx electron-builder --mac zip --x64 --publish never
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
